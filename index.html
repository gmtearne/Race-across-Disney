    <!-- Tailwind CSS CDN -->

            { id: "ak_8", name: "Festival of the Lion King", park: "Animal Kingdom", lat: 28.3600, lng: -81.5939 }

        // Strict Photo-Based Bonus Challenges (No GPS required)
        const PREPOPULATED_BONUSES = [
            { id: "b1", title: "Photo with Mickey Mouse", bonusMinutes: 15, desc: "Take a selfie or group photo with Mickey Mouse." },
            { id: "b2", title: "Group Photo in Front of Cinderella Castle", bonusMinutes: 10, desc: "Entire team wearing big smiles in front of the castle." },
            { id: "b3", title: "Wearing Goofy or Mickey Ears", bonusMinutes: 5, desc: "Photo of all team members rocking Disney headwear." },
            { id: "b4", title: "Selfie with a Disney Cast Member", bonusMinutes: 10, desc: "Kindly ask a Cast Member for a quick team photo!" },
            { id: "b5", title: "Creative Disney Bounding Photo", bonusMinutes: 15, desc: "Group photo showing off your themed character outfits." },
            { id: "b6", title: "Photo Eating a Mickey Shaped Treat", bonusMinutes: 10, desc: "Mickey ice cream bar, pretzel, or waffle!" },
            { id: "b7", title: "Photo with Donald Duck or Goofy", bonusMinutes: 10, desc: "Meet and greet snap with Donald or Goofy." }
        ];

        // App Application State
        let currentUser = null;
        let activeRole = 'guest'; // 'organiser', 'team', 'guest'
        let currentRaceCode = null;
        let currentRaceData = null;
        let currentTeamData = null;
        let unsubscribeRaceListener = null;
        let devGpsSimulation = true; // Toggle for testing GPS without physical presence

        // Toast Helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-700';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info'}" class="w-4 h-4"></i> ${message}`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- AUTHENTICATION INIT ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth initialization fallback to anonymous", err);
                try { await signInAnonymously(auth); } catch (e) { console.error(e); }
            }

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                renderHeaderStatus();
                if (!currentRaceCode) {
                    renderLandingPage();
                }
            });
        }

        function renderHeaderStatus() {
            const container = document.getElementById('user-status');
            if (activeRole === 'organiser') {
                container.innerHTML = `
                    <span class="bg-purple-900/60 text-purple-200 border border-purple-500/30 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-purple-400"></i> Organiser
                    </span>
                    <button id="btn-logout" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">Exit</button>
                `;
            } else if (activeRole === 'team' && currentTeamData) {
                container.innerHTML = `
                    <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5">
                        <i data-lucide="users" class="w-3.5 h-3.5"></i> ${currentTeamData.name}
                    </span>
                    <button id="btn-logout" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">Leave</button>
                `;
            } else {
                container.innerHTML = `
                    <button id="btn-organizer-auth" class="text-xs text-amber-400 hover:text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 px-3 py-1.5 rounded-lg border border-amber-500/30 transition-all flex items-center gap-1 font-medium">
                        <i data-lucide="key" class="w-3.5 h-3.5"></i> Organiser Portal
                    </button>
                `;
            }
            lucide.createIcons();

            const logoutBtn = document.getElementById('btn-logout');
            if (logoutBtn) logoutBtn.addEventListener('click', leaveSession);

            const orgBtn = document.getElementById('btn-organizer-auth');
            if (orgBtn) orgBtn.addEventListener('click', renderOrganiserAuthModal);
        }

        function leaveSession() {
            if (unsubscribeRaceListener) unsubscribeRaceListener();
            activeRole = 'guest';
            currentRaceCode = null;
            currentRaceData = null;
            currentTeamData = null;
            renderHeaderStatus();
            renderLandingPage();
            showToast("Logged out of session.");
        }

        // --- LANDING PAGE / RACE ENTRY ---
        function renderLandingPage() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="max-w-md mx-auto space-y-6">
                    <!-- Join Race Card -->
                    <div class="glass-panel p-6 rounded-2xl shadow-2xl border border-slate-700">
                        <div class="text-center mb-6">
                            <h2 class="text-xl font-bold text-white flex items-center justify-center gap-2">
                                <i data-lucide="flag" class="text-amber-400 w-5 h-5"></i> Enter Disney Race
                            </h2>
                            <p class="text-xs text-slate-400 mt-1">Join an existing race with your team or check standings</p>
                        </div>

                        <form id="join-race-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">4-DIGIT RACE CODE</label>
                                <input type="text" id="race-code-input" maxlength="6" uppercase required placeholder="e.g. MAGIC1" 
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-mono tracking-widest text-amber-400 focus:outline-none focus:border-amber-500 uppercase">
                            </div>

                            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                <i data-lucide="arrow-right" class="w-5 h-5"></i> Continue
                            </button>
                        </form>
                    </div>

                    <!-- Quick Organiser Shortcut Card -->
                    <div class="glass-card p-5 rounded-xl border border-slate-800 text-center">
                        <p class="text-xs text-slate-400 mb-3">Hosting or planning a race event?</p>
                        <button id="btn-org-portal-shortcut" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold py-2.5 px-4 rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
                            <i data-lucide="user-check" class="w-4 h-4 text-purple-400"></i> Organiser Login / Sign Up
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('btn-org-portal-shortcut').addEventListener('click', renderOrganiserAuthModal);
            document.getElementById('join-race-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const code = document.getElementById('race-code-input').value.trim().toUpperCase();
                if (code) verifyRaceCodeAndProceed(code);
            });
        }

        // Check if race exists in Firestore
        async function verifyRaceCodeAndProceed(raceCode) {
            if (!currentUser) return;
            const raceRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', raceCode);
            try {
                const snapshot = await getDoc(raceRef);
                if (!snapshot.exists()) {
                    showToast(`Race Code "${raceCode}" not found. Ask organizer for correct code.`, 'error');
                    return;
                }
                currentRaceCode = raceCode;
                currentRaceData = snapshot.data();
                renderTeamOnboardingModal();
            } catch (err) {
                console.error(err);
                showToast("Failed to verify race code.", 'error');
            }
        }

        // --- TEAM SECURITY & ONBOARDING (PIN + OPTIONAL PHOTO) ---
        function renderTeamOnboardingModal() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="max-w-md mx-auto glass-panel p-6 rounded-2xl shadow-2xl border border-slate-700">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-white">Join Race: ${currentRaceCode}</h2>
                            <p class="text-xs text-amber-400 font-medium">${currentRaceData.title || 'Disney Rally'}</p>
                        </div>
                        <button id="btn-cancel-join" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form id="team-onboard-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">TEAM NAME</label>
                            <input type="text" id="team-name-input" required placeholder="e.g. Space Mountaineers" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">4-DIGIT SECURITY PIN</label>
                            <input type="password" maxlength="4" pattern="[0-9]{4}" id="team-pin-input" required placeholder="••••" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-lg tracking-widest font-mono text-amber-400 focus:outline-none focus:border-amber-500">
                            <p class="text-[11px] text-slate-400 mt-1">Protects your team profile from unauthorized logins.</p>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">TEAM AVATAR PHOTO (OPTIONAL)</label>
                            <div class="flex items-center gap-3">
                                <div id="avatar-preview" class="w-12 h-12 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center overflow-hidden shrink-0">
                                    <i data-lucide="image" class="w-6 h-6 text-slate-500"></i>
                                </div>
                                <input type="file" id="team-avatar-file" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-amber-400 hover:file:bg-slate-700">
                            </div>
                        </div>

                        <div id="pin-prompt-info" class="hidden p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-300">
                            <i data-lucide="info" class="w-4 h-4 inline mr-1"></i> Team already exists! Enter your 4-digit PIN to authenticate.
                        </div>

                        <button type="submit" id="btn-submit-team" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 mt-2">
                            <i data-lucide="check-circle" class="w-5 h-5"></i> Enter Race Dashboard
                        </button>
                    </form>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('btn-cancel-join').addEventListener('click', renderLandingPage);

            let base64Avatar = '';
            document.getElementById('team-avatar-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        base64Avatar = evt.target.result;
                        document.getElementById('avatar-preview').innerHTML = `<img src="${base64Avatar}" class="w-full h-full object-cover">`;
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('team-onboard-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const teamName = document.getElementById('team-name-input').value.trim();
                const pin = document.getElementById('team-pin-input').value.trim();

                if (!teamName || pin.length !== 4) {
                    showToast("Please enter a valid Team Name and a 4-digit PIN", "error");
                    return;
                }

                await handleTeamRegistrationOrLogin(teamName, pin, base64Avatar);
            });
        }

        async function handleTeamRegistrationOrLogin(teamName, pin, avatarBase64) {
            if (!currentUser || !currentRaceCode) return;

            const raceRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', currentRaceCode);
            try {
                const snapshot = await getDoc(raceRef);
                if (!snapshot.exists()) {
                    showToast("Race no longer exists.", "error");
                    renderLandingPage();
                    return;
                }

                const raceData = snapshot.data();
                const existingTeams = raceData.teams || {};
                const teamKey = teamName.toLowerCase();

                if (existingTeams[teamKey]) {
                    // Team exists -> Validate PIN
                    const existingTeam = existingTeams[teamKey];
                    if (existingTeam.pin && existingTeam.pin !== pin) {
                        showToast("Incorrect 4-digit Security PIN for this team!", "error");
                        document.getElementById('pin-prompt-info').classList.remove('hidden');
                        return;
                    }
                    // PIN matched! Logged in as existing team
                    if (avatarBase64) {
                        existingTeam.avatar = avatarBase64;
                        existingTeams[teamKey] = existingTeam;
                        await updateDoc(raceRef, { teams: existingTeams });
                    }
                    currentTeamData = existingTeam;
                } else {
                    // Create New Team Profile
                    const newTeamObj = {
                        id: 'team_' + Date.now(),
                        name: teamName,
                        pin: pin,
                        avatar: avatarBase64 || '',
                        joinedAt: Date.now(),
                        completedCheckpoints: [],
                        claimedBonuses: {}, // bonusId: { photoUrl, timestamp }
                        startTime: Date.now(),
                        finishTime: null
                    };

                    existingTeams[teamKey] = newTeamObj;
                    await updateDoc(raceRef, { teams: existingTeams });
                    currentTeamData = newTeamObj;
                }

                activeRole = 'team';
                renderHeaderStatus();
                subscribeToRaceUpdates();
                showToast(`Welcome team ${currentTeamData.name}!`, "success");

            } catch (err) {
                console.error(err);
                showToast("Error registering/authenticating team.", "error");
            }
        }

            const main = document.getElementById('main-content');

        // Haversine Distance Formula & Proximity Check
        function verifyGpsProximity(cpObj) {
            if (devGpsSimulation) {
                markCheckpointComplete(cpObj.id);
                showToast(`[SIMULATED GPS SUCCESS] Arrived at ${cpObj.name}!`, 'success');
                return;
            }

            if (!navigator.geolocation) {
                showToast("Geolocation is not supported by your browser.", "error");
                return;
            }

            showToast("Acquiring GPS location...", "info");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const userLat = pos.coords.latitude;
                    const userLng = pos.coords.longitude;
                    const distanceMeters = getHaversineDistance(userLat, userLng, cpObj.lat, cpObj.lng);

                    if (distanceMeters <= 150) { // Within 150 meters radius
                        markCheckpointComplete(cpObj.id);
                        showToast(`GPS Verified! You have reached ${cpObj.name}!`, 'success');
                    } else {
                        showToast(`Too far from ${cpObj.name}. (${Math.round(distanceMeters)}m away, required <150m)`, 'error');
                    }
                },
                (err) => {
                    showToast("Failed to acquire GPS location. Enable GPS or use Simulation Mode.", "error");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        }

                                            <div>
                                                <span class="text-xs text-emerald-400 font-bold flex items-center gap-1"><i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Claimed</span>
                                                <span class="text-[11px] text-slate-500 block">${new Date(claimedBonuses[b.id].timestamp).toLocaleTimeString()}</span>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="pt-2 border-t border-slate-700/50 flex items-center justify-between gap-2">
                                            <input type="file" accept="image/*" id="bonus-file-${b.id}" class="text-xs text-slate-400 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-emerald-400 hover:file:bg-slate-700">
                                            <button data-bid="${b.id}" class="btn-claim-bonus bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow transition shrink-0">
                                                Claim
                                            </button>
                                        </div>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.querySelectorAll('.btn-claim-bonus').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const bid = btn.getAttribute('data-bid');
                    const fileInput = document.getElementById(`bonus-file-${bid}`);
                    
                    if (!fileInput.files || !fileInput.files[0]) {
                        showToast("Please select a photo before claiming bonus!", "error");
                        return;
                    }

                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const photoBase64 = evt.target.result;
                        await submitBonusPhotoClaim(bid, photoBase64);
                    };
                    reader.readAsDataURL(file);
                });
            });
        }

        async function submitBonusPhotoClaim(bonusId, photoBase64) {
            const claimed = currentTeamData.claimedBonuses || {};
            claimed[bonusId] = {
                photoUrl: photoBase64,
                timestamp: Date.now()
            };

            const raceRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', currentRaceCode);
            const teamKey = currentTeamData.name.toLowerCase();
            const updatePath = `teams.${teamKey}.claimedBonuses`;

            await updateDoc(raceRef, {
                [updatePath]: claimed
            });

            showToast("Bonus photo submitted and time deducted!", "success");
        }

        // Render Leaderboard Tab
        function renderLeaderboardTab() {
            const container = document.getElementById('tab-content-area');
            const teamsObj = currentRaceData.teams || {};
            const mandatoryCount = (currentRaceData.checkpoints || []).length;
            const bonusesList = currentRaceData.bonusChallenges || PREPOPULATED_BONUSES;

            // Calculate Net Score / Time for each team
            const teamList = Object.values(teamsObj).map(team => {
                const compCount = (team.completedCheckpoints || []).length;
                const missed = Math.max(0, mandatoryCount - compCount);
                const penaltyMins = missed * 60; // +60 mins per missed mandatory

                let bonusDeductionMins = 0;
                const claimed = team.claimedBonuses || {};
                Object.keys(claimed).forEach(bid => {
                    const bObj = bonusesList.find(b => b.id === bid);
                    if (bObj) bonusDeductionMins += (bObj.bonusMinutes || 0);
                });

                const rawElapsedMins = Math.floor(((team.finishTime || Date.now()) - team.startTime) / 60000);
                const netTimeMins = Math.max(0, rawElapsedMins + penaltyMins - bonusDeductionMins);

                return {
                    ...team,
                    completedCount: compCount,
                    penaltyMins,
                    bonusDeductionMins,
                    netTimeMins
                };
            }).sort((a, b) => {
                // Sort by completed checkpoints first, then by lowest net time
                if (b.completedCount !== a.completedCount) return b.completedCount - a.completedCount;
                return a.netTimeMins - b.netTimeMins;
            });

            container.innerHTML = `
                <div class="glass-card p-5 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                        <i data-lucide="award" class="w-4 h-4"></i> Live Disney Leaderboard
                    </h3>

                    <div class="divide-y divide-slate-800">
                        ${teamList.map((tm, idx) => {
                            const isCurrent = currentTeamData && tm.name.toLowerCase() === currentTeamData.name.toLowerCase();
                            const claimedKeys = Object.keys(tm.claimedBonuses || {});

                            return `
                                <div class="py-3 flex items-center justify-between ${isCurrent ? 'bg-amber-500/10 px-3 rounded-xl border border-amber-500/30' : ''}">
                                    <div class="flex items-center gap-3">
                                        <span class="font-extrabold text-sm ${idx === 0 ? 'text-amber-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-700' : 'text-slate-500'}">
                                            #${idx + 1}
                                        </span>
                                        ${tm.avatar 
                                            ? `<img src="${tm.avatar}" class="w-9 h-9 rounded-full object-cover border border-slate-600">`
                                            : `<div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-amber-400">${tm.name[0]}</div>`
                                        }
                                        <div>
                                            <h4 class="text-xs font-bold text-white flex items-center gap-1.5">
                                                ${tm.name} ${isCurrent ? '<span class="text-[10px] bg-amber-500 text-slate-950 px-1.5 rounded font-bold">YOU</span>' : ''}
                                            </h4>
                                            <div class="flex items-center gap-2 mt-0.5">
                                                <span class="text-[11px] text-slate-400">${tm.completedCount}/${mandatoryCount} Mandatories</span>
                                                ${claimedKeys.length > 0 ? `<span class="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-1.5 rounded">⭐ ${claimedKeys.length} Bonuses</span>` : ''}
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-right">
                                        <span class="text-xs font-mono font-bold text-amber-400 block">${tm.netTimeMins} min net</span>
                                        <span class="text-[10px] text-slate-500 block">(-${tm.bonusDeductionMins}m bonus)</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- ORGANISER RACE CONTROL VIEW (MANAGE TEAMS & CHECKPOINTS) ---
        function renderOrganiserRaceControlView() {
            const main = document.getElementById('main-content');
            const mandatoryList = currentRaceData.checkpoints || [];
            const teamsObj = currentRaceData.teams || {};
            const teamList = Object.values(teamsObj);

            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Control Banner -->
                    <div class="glass-panel p-5 rounded-2xl border border-purple-500/30 flex justify-between items-center">
                        <div>
                            <span class="text-xs text-purple-400 font-bold uppercase tracking-wider">Organiser Management</span>
                            <h2 class="text-xl font-bold text-white">${currentRaceData.title} (${currentRaceCode})</h2>
                        </div>
                        <button id="btn-back-org-selector" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl border border-slate-700 flex items-center gap-1">
                            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Select Race
                        </button>
                    </div>

                    <!-- Organiser Tabs -->
                    <div class="flex border-b border-slate-700 space-x-6 text-sm font-bold">
                        <button id="org-tab-teams" class="pb-3 border-b-2 border-purple-500 text-purple-400 flex items-center gap-2">
                            <i data-lucide="users" class="w-4 h-4"></i> Manage Teams (${teamList.length})
                        </button>
                        <button id="org-tab-checkpoints" class="pb-3 border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2">
                            <i data-lucide="map-pin" class="w-4 h-4"></i> Manage Checkpoints (${mandatoryList.length})
                        </button>
                    </div>

                    <div id="org-tab-content" class="space-y-4">
                        <!-- Content rendered dynamically -->
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('btn-back-org-selector').addEventListener('click', renderOrganiserRaceSelector);

            const tabTeams = document.getElementById('org-tab-teams');
            const tabCps = document.getElementById('org-tab-checkpoints');

            tabTeams.addEventListener('click', () => {
                setActiveTab(tabTeams, [tabCps]);
                renderOrganiserTeamsTab();
            });

            tabCps.addEventListener('click', () => {
                setActiveTab(tabCps, [tabTeams]);
                renderOrganiserCheckpointsTab();
            });

            renderOrganiserTeamsTab();
        }

        // Organiser: Manage Teams (with Deletion Capability)
        function renderOrganiserTeamsTab() {
            const container = document.getElementById('org-tab-content');
            const teamsObj = currentRaceData.teams || {};
            const teamList = Object.values(teamsObj);

            if (teamList.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 p-6 text-center glass-card rounded-xl">No teams have joined this race yet.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="glass-card p-5 rounded-2xl border border-slate-800 space-y-3">
                    <h3 class="text-sm font-bold text-white mb-2">Registered Teams</h3>
                    <div class="divide-y divide-slate-800">
                        ${teamList.map(tm => `
                            <div class="py-3 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    ${tm.avatar 
                                        ? `<img src="${tm.avatar}" class="w-10 h-10 rounded-full object-cover border border-slate-600">`
                                        : `<div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-amber-400">${tm.name[0]}</div>`
                                    }
                                    <div>
                                        <h4 class="text-sm font-bold text-white">${tm.name}</h4>
                                        <span class="text-[11px] text-slate-400">PIN: <span class="font-mono text-amber-400">${tm.pin || 'N/A'}</span></span>
                                    </div>
                                </div>

                                <button data-teamname="${tm.name}" class="btn-delete-team bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/30 text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete Team
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.querySelectorAll('.btn-delete-team').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const teamName = btn.getAttribute('data-teamname');
                    await deleteTeamFromRace(teamName);
                });
            });
        }

        async function deleteTeamFromRace(teamName) {
            const teamsObj = currentRaceData.teams || {};
            const teamKey = teamName.toLowerCase();
            if (teamsObj[teamKey]) {
                delete teamsObj[teamKey];
                const raceRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', currentRaceCode);
                await updateDoc(raceRef, { teams: teamsObj });
                showToast(`Team "${teamName}" deleted from race.`, "success");
            }
        }

        // Organiser: Manage Checkpoints (Add custom or Delete individual checkpoints)
        function renderOrganiserCheckpointsTab() {
            const container = document.getElementById('org-tab-content');
            const mandatoryList = currentRaceData.checkpoints || [];

            container.innerHTML = `
                <div class="space-y-4">
                    <!-- Add Custom Checkpoint Modal Trigger -->
                    <div class="glass-card p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                            <h4 class="text-sm font-bold text-white">Custom Checkpoints</h4>
                            <p class="text-xs text-slate-400">Add custom GPS location coordinates to this active race.</p>
                        </div>
                        <button id="btn-show-add-cp-form" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow">
                            + Add Custom Checkpoint
                        </button>
                    </div>

                    <!-- Hidden Add Form -->
                    <form id="add-cp-form" class="hidden glass-panel p-4 rounded-xl border border-purple-500/30 space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" id="custom-cp-name" required placeholder="Checkpoint Name" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-white">
                            <input type="text" id="custom-cp-park" required placeholder="Park Name (e.g. EPCOT)" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-white">
                            <div class="flex gap-2">
                                <input type="number" step="any" id="custom-cp-lat" required placeholder="Lat" class="w-1/2 bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-white">
                                <input type="number" step="any" id="custom-cp-lng" required placeholder="Lng" class="w-1/2 bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-white">
                            </div>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="button" id="btn-cancel-add-cp" class="text-xs text-slate-400 px-3 py-1.5">Cancel</button>
                            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs px-4 py-1.5 rounded-xl">Save Checkpoint</button>
                        </div>
                    </form>

                    <!-- Existing Checkpoints List -->
                    <div class="glass-card p-5 rounded-2xl border border-slate-800 space-y-3">
                        <h3 class="text-sm font-bold text-white mb-2">Active Mandatory Checkpoints</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${mandatoryList.map(cp => `
                                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                                    <div>
                                        <span class="text-[10px] font-bold text-amber-400 uppercase">${cp.park}</span>
                                        <h5 class="text-xs font-bold text-white">${cp.name}</h5>
                                    </div>
                                    <button data-cpid="${cp.id}" class="btn-delete-cp text-red-400 hover:text-red-300 p-1.5 rounded-lg hover:bg-red-500/10 transition">
                                        <i data-lucide="trash" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('btn-show-add-cp-form').addEventListener('click', () => {
                document.getElementById('add-cp-form').classList.toggle('hidden');
            });
            document.getElementById('btn-cancel-add-cp').addEventListener('click', () => {
                document.getElementById('add-cp-form').classList.add('hidden');
            });

            document.getElementById('add-cp-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('custom-cp-name').value.trim();
                const park = document.getElementById('custom-cp-park').value.trim();
                const lat = parseFloat(document.getElementById('custom-cp-lat').value);
                const lng = parseFloat(document.getElementById('custom-cp-lng').value);

                const newCp = { id: 'custom_' + Date.now(), name, park, lat, lng };
                mandatoryList.push(newCp);

                const raceRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', currentRaceCode);
                await updateDoc(raceRef, { checkpoints: mandatoryList });
                showToast(`Added checkpoint "${name}"`, "success");
            });

            document.querySelectorAll('.btn-delete-cp').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const cpId = btn.getAttribute('data-cpid');
                    await deleteCheckpointFromRace(cpId);
                });
            });
        }

        async function deleteCheckpointFromRace(cpId) {
            let mandatoryList = currentRaceData.checkpoints || [];
            mandatoryList = mandatoryList.filter(cp => cp.id !== cpId);

            const raceRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', currentRaceCode);
            await updateDoc(raceRef, { checkpoints: mandatoryList });
            showToast("Checkpoint deleted from race.", "success");
        }

        // Initialize App on Load
        window.addEventListener('load', () => {
            initAuth();
        });
    </script>
</body>
</html>
